# v4
name: tdl archive verify

on:
  push:
    branches:
      - tmp/tdl-archive-verify-20260731
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.10
          cache: false
      - name: Apply patch
        run: |
          set -euo pipefail
          echo 'ce70a814ed50cdf1e1d86e5e79337a21b5d187b5855505745f8db85d7f274e15  tdl-archive-verify/tdl-archive-reliability-v4.patch.xz' | sha256sum --check
          xz -dc tdl-archive-verify/tdl-archive-reliability-v4.patch.xz > /tmp/tdl-archive.patch
          echo 'c75c3557ac6d19bd1619df88d388b06b5e8ab826d7bf1d76b831957204695803  /tmp/tdl-archive.patch' | sha256sum --check
          git clone --filter=blob:none https://github.com/yshalsager/tdl-archive.git /tmp/tdl-archive
          git -C /tmp/tdl-archive checkout d5cddd4
          git -C /tmp/tdl-archive apply --check /tmp/tdl-archive.patch
          git -C /tmp/tdl-archive apply /tmp/tdl-archive.patch
          cd /tmp/tdl-archive
          test -z "$(gofmt -l *.go)"
          git diff --check
      - name: Verify modules
        run: cd /tmp/tdl-archive && go mod verify
      - name: Test
        run: cd /tmp/tdl-archive && go test -count=1 ./...
      - name: Vet
        run: cd /tmp/tdl-archive && go vet ./...
      - name: Build
        run: cd /tmp/tdl-archive && go build -trimpath -o /tmp/tdl-archive-bin .
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.2
          cd /tmp/tdl-archive
          golangci-lint run
      - name: Cross-build release targets
        run: |
          set -euo pipefail
          cd /tmp/tdl-archive
          for target in $(go tool dist list | grep -E '^(darwin|freebsd|linux|windows)/(386|amd64|arm|arm64)$'); do
            os=${target%/*}
            arch=${target#*/}
            if [ "$arch" = arm ]; then
              for arm in 5 6 7; do
                CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=$arm go build -trimpath -o /tmp/tdl-archive-$os-$arch-v$arm .
              done
            else
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o /tmp/tdl-archive-$os-$arch .
            fi
          done
      - name: Race test
        run: cd /tmp/tdl-archive && go test -race -count=1 ./...
